<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ETRNL Analytics — Symbol</title>
  <link rel="stylesheet" href="/static/shared.css">
</head>
<body>
  <div id="nav-mount"></div>

  <div class="container">
    <!-- Ticker Header -->
    <div class="card" style="margin-bottom:16px;padding:16px 20px">
      <div class="flex" style="align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px">
        <div class="flex gap-16" style="align-items:center">
          <div class="gradient-text" style="font-size:30px;letter-spacing:4px" id="hdr-ticker">—</div>
          <div class="mono" style="font-size:20px" id="hdr-spot">$—</div>
          <div class="mono" id="hdr-change" style="font-size:14px">—</div>
          <span class="badge badge-neutral" id="hdr-regime">—</span>
        </div>
        <div class="star-bar" id="hdr-stars"></div>
      </div>
    </div>

    <div class="row row-2">
      <!-- LEFT -->
      <div class="flex-col gap-16">
        <div class="card" style="padding:0;overflow:hidden">
          <div style="padding:10px 18px 0;display:flex;align-items:center;justify-content:space-between">
            <h3 style="margin:0">Chart</h3>
            <div style="display:flex;gap:6px;align-items:center">
              <span style="font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--text-dim)">Live Feed</span>
              <button id="tv-toggle-btn" style="padding:4px 10px;font-size:9px;border:1px solid var(--orange);color:var(--orange);border-radius:5px;cursor:pointer;letter-spacing:1px;text-transform:uppercase;font-family:var(--font-mono);background:transparent">ON</button>
            </div>
          </div>
          <div id="tv-live-wrap" class="tradingview-widget-container" style="height:460px">
            <div id="tradingview-chart" style="height:460px"></div>
          </div>
          <div id="tv-static-wrap" style="display:none;height:460px;position:relative">
            <canvas id="tv-static-canvas" style="width:100%;height:460px;display:block;background:#0d0d0d;border-radius:0;border:none"></canvas>
          </div>
        </div>

        <div class="card" id="dealer-card">
          <h3>Dealer Structure</h3>
          <div class="content"></div>
        </div>

        <div class="card" id="contracts-card">
          <h3>Contract Scorer</h3>
          <div class="flex gap-8" style="margin-bottom:10px">
            <button class="primary" data-bias="bullish">Bullish</button>
            <button data-bias="bearish">Bearish</button>
          </div>
          <div class="content"></div>
        </div>
      </div>

      <!-- RIGHT -->
      <div class="flex-col gap-16">
        <div class="card" id="heatmap-card">
          <h3>GEX Heatmap</h3>
          <div class="heatmap-controls">
            <span>STRIKES</span>
            <div class="btn-group" id="strike-group">
              <button data-v="15">±15</button>
              <button data-v="30" class="active">±30</button>
              <button data-v="50">±50</button>
              <button data-v="999">ALL</button>
            </div>
            <span style="margin-left:8px">EXPIRIES</span>
            <div class="btn-group" id="expiry-group">
              <button data-v="5" class="active">5</button>
              <button data-v="10">10</button>
              <button data-v="15">15</button>
              <button data-v="999">ALL</button>
            </div>
          </div>
          <div id="gex-grid-container" style="overflow:auto"></div>
        </div>

        <div class="card" id="vex-card">
          <h3>VEX Heatmap <span class="muted" style="font-size:9px;letter-spacing:0.5px">(≈ Δ·Vega / Spot)</span></h3>
          <div class="heatmap-controls">
            <span>STRIKES</span>
            <div class="btn-group" id="vex-strike-group">
              <button data-v="15">±15</button>
              <button data-v="30" class="active">±30</button>
              <button data-v="50">±50</button>
              <button data-v="999">ALL</button>
            </div>
            <span style="margin-left:8px">EXPIRIES</span>
            <div class="btn-group" id="vex-expiry-group">
              <button data-v="5" class="active">5</button>
              <button data-v="10">10</button>
              <button data-v="15">15</button>
              <button data-v="999">ALL</button>
            </div>
          </div>
          <div id="vex-grid-container">
            <div class="muted" style="font-size:11px;padding:18px 0;text-align:center">VEX data not yet available from backend.</div>
            <div class="muted" style="font-size:9px;text-align:center;opacity:0.5;margin-top:4px">Will auto-populate when /curve/ emits pt.vex or pt.vanna</div>
          </div>
        </div>

        <div class="card" id="rs-card">
          <h3>RS Card</h3>
          <div class="content"></div>
        </div>

        <div class="card" id="macro-mini">
          <h3>Macro Brief</h3>
          <div class="content" style="max-height:280px;overflow-y:auto"></div>
        </div>

        <div class="card" id="trade-plan-chat" style="display:flex;flex-direction:column;min-height:440px">
          <h3>Trade Plan Agent</h3>
          <div class="chat" style="flex:1">
            <div class="chat-history" id="tp-history"></div>
            <div class="chat-input">
              <textarea id="tp-input" placeholder="Ask about levels, stops, sizing…"></textarea>
              <button class="primary" id="tp-send">Send</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://s3.tradingview.com/tv.js" async></script>
  <script src="/static/shared.js"></script>
  <script>
  // shared.js globals available directly

  let TICKER = (getQueryParam('ticker') || sessionStorage.getItem('aion_ticker') || 'NVDA').toUpperCase();
  SS.set('aion_ticker', TICKER);
  let strikeRange = 30, expiryCount = 5;
  let dealerCache = null;
  let chatMessages = [];

  function loadTradingView() {
    if (typeof TradingView === 'undefined') {
      setTimeout(loadTradingView, 250);
      return;
    }
    new TradingView.widget({
      container_id: 'tradingview-chart',
      symbol: TICKER,
      interval: '15',
      timezone: 'America/New_York',
      theme: 'dark',
      style: '1',
      locale: 'en',
      toolbar_bg: '#000000',
      enable_publishing: false,
      hide_top_toolbar: false,
      hide_legend: false,
      save_image: false,
      backgroundColor: '#000000',
      gridColor: 'rgba(26,26,26,0.5)',
      width: '100%',
      height: 430,
      studies: ['MAExp@tv-basicstudies', 'VWAP@tv-basicstudies'],
    });
  }

  // ---------- Dealer card ----------
  async function renderDealer() {
    const card = document.querySelector('#dealer-card .content');
    card.innerHTML = skeleton(4);
    try {
      const r = await api(`/rankings/${TICKER}`);
      dealerCache = r;
      const spot = Number(r.spot || 0);
      const cw = Number(r.call_wall || 0);
      const pw = Number(r.put_wall || 0);
      const king = Number(r.king_node || 0);
      const flip = Number(r.gamma_flip || r.flip || 0);
      const cwPct = spot ? (cw - spot) / spot * 100 : 0;
      const pwPct = spot ? (pw - spot) / spot * 100 : 0;
      const flipPct = spot && flip ? (flip - spot) / spot * 100 : 0;
      const change = Number(r.change_pct || 0);

      document.getElementById('hdr-ticker').textContent = TICKER;
      document.getElementById('hdr-spot').textContent = `$${spot.toFixed(2)}`;
      document.getElementById('hdr-change').textContent = fmtPct(change);
      document.getElementById('hdr-change').style.color = change >= 0 ? 'var(--blue)' : 'var(--red)';
      const rb = document.getElementById('hdr-regime');
      rb.textContent = r.regime || '—';
      rb.className = `badge ${regimeClass(r.regime)}`;

      // Star nodes from signals
      const stars = (r.signals || []).slice(0, 4);
      document.getElementById('hdr-stars').innerHTML = stars.map(s => `
        <span class="pill ${(s.bias === 'bullish') ? 'green' : (s.bias === 'bearish') ? 'red' : 'amber'}">
          ★ ${s.kind || s.signal || '—'}
        </span>
      `).join('');

      card.innerHTML = `
        <div class="engine-out">
          <div class="row-line"><span class="muted">King Node</span>
            <span class="mono" style="color:var(--silver)">$${king.toFixed(2)}</span></div>
          <div class="row-line"><span class="muted">Call Wall</span>
            <span class="mono" style="color:var(--purple)">$${cw.toFixed(2)} <span class="muted">(${fmtPct(cwPct)})</span></span></div>
          <div class="row-line"><span class="muted">Put Wall</span>
            <span class="mono" style="color:var(--blue)">$${pw.toFixed(2)} <span class="muted">(${fmtPct(pwPct)})</span></span></div>
          <div class="row-line"><span class="muted">Flip Zone</span>
            <span class="mono" style="color:var(--silver)">$${flip ? flip.toFixed(2) : '—'} <span class="muted">(${flip ? fmtPct(flipPct) : '—'})</span></span></div>
          <div class="row-line"><span class="muted">Regime</span>
            <span class="badge ${regimeClass(r.regime)}">${r.regime || '—'}</span></div>
        </div>
      `;
    } catch (err) { card.innerHTML = errorPane(err); }
  }

  // ---------- Contract scorer ----------
  async function renderContracts(bias = 'bullish') {
    const card = document.querySelector('#contracts-card .content');
    card.innerHTML = skeleton(2);
    document.querySelectorAll('#contracts-card button').forEach(b => {
      b.classList.toggle('primary', b.dataset.bias === bias);
    });
    try {
      const r = await api(`/contracts/${TICKER}?bias=${bias}`);
      function row(label, c) {
        if (!c) return `<div class="row-line"><span class="muted">${label}</span><span class="muted">—</span></div>`;
        return `<div class="row-line">
          <span class="muted">${label}</span>
          <span class="mono">${c.contract_symbol || (c.strike + ' ' + c.option_type)} ${c.expiry || ''} · Δ${(c.delta || 0).toFixed(2)} · $${(c.mid || c.premium_mid || 0).toFixed(2)}</span>
        </div>`;
      }
      card.innerHTML = `<div class="engine-out">
        ${row('Best', r.best)}
        ${row('Safer', r.safer)}
        ${row('Convex', r.convex)}
      </div>`;
    } catch (err) { card.innerHTML = errorPane(err); }
  }

  // ---------- Heatmap ----------
  async function buildGexGrid() {
    const ranking = dealerCache || await api(`/rankings/${TICKER}`);
    const expRes = await api(`/expiries/${TICKER}`).catch(() => ({ expiries: [] }));
    const expiries = (expRes.expiries || []).slice(0, expiryCount);
    const spot = Number(ranking.spot || 0);

    // Build per-expiry curves
    const grid = []; // rows = strikes, cols = expiries
    const strikeSet = new Set();
    const curves = [];
    await Promise.all(expiries.map(async (exp) => {
      try {
        const c = await api(`/curve/${TICKER}?expiry=${encodeURIComponent(exp)}`);
        const curve = c.curve || [];
        curves.push({ exp, curve });
        curve.forEach(pt => strikeSet.add(Number(pt.strike)));
      } catch (_) { curves.push({ exp, curve: [] }); }
    }));

    let strikes = Array.from(strikeSet).sort((a, b) => a - b);
    if (strikeRange < 999) {
      strikes = strikes.filter(s => Math.abs(s - spot) / Math.max(spot, 1) * 100 <= strikeRange);
    }

    const gex = strikes.map(() => Array(expiries.length).fill(0));
    const vex = strikes.map(() => Array(expiries.length).fill(0));
    curves.forEach((co, j) => {
      const exIdx = expiries.indexOf(co.exp);
      if (exIdx < 0) return;
      co.curve.forEach(pt => {
        const i = strikes.indexOf(Number(pt.strike));
        if (i < 0) return;
        gex[i][exIdx] = Number(pt.net_exposure || 0);
        vex[i][exIdx] = Number(pt.vex || pt.vanna || 0);
      });
    });

    return { strikes, expiries, gex, vex, spot, ranking };
  }

  function renderGexTable(strikes, expiries, gexGrid, spot) {
    const strikesDesc = [...strikes].sort((a, b) => b - a);
    let absMax = 0;
    gexGrid.forEach(row => row.forEach(v => { if (Math.abs(v) > absMax) absMax = Math.abs(v); }));
    if (absMax === 0) absMax = 1;

    const nExp = expiries.length;
    const container = document.getElementById('gex-grid-container');
    if (!container) return;

    let html = '<table style="border-collapse:collapse;width:100%;font-size:9px;font-family:var(--font-mono)">';
    html += '<thead><tr>';
    html += '<th style="text-align:right;padding:3px 6px 3px 0;color:var(--text-dim);font-weight:400;font-size:9px">Strike</th>';
    expiries.forEach(exp => {
      const mmdd = String(exp).slice(5);
      html += `<th style="text-align:center;padding:3px 2px;color:var(--text-dim);font-weight:400;font-size:9px">${mmdd}</th>`;
    });
    html += '</tr></thead><tbody>';

    strikesDesc.forEach(strike => {
      const origIdx = strikes.indexOf(strike);
      const isSpot = Math.abs(strike - spot) <= Math.min(1, (strikes[1] - strikes[0]) / 2);
      const spotOutline = isSpot ? 'outline:1px solid rgba(0,200,212,0.5);outline-offset:-1px;' : '';
      const strikeColor = isSpot ? 'color:#00c8d4;font-weight:700;' : 'color:var(--text-dim);';
      const strikeLabel = (isSpot ? '→ ' : '') + '$' + (strike >= 100 ? strike.toFixed(0) : strike.toFixed(2));

      html += '<tr>';
      html += `<td style="text-align:right;padding:2px 6px 2px 0;white-space:nowrap;${strikeColor}font-size:9px">${strikeLabel}</td>`;

      expiries.forEach((_, expIdx) => {
        const v = gexGrid[origIdx] ? gexGrid[origIdx][expIdx] : 0;
        const t = 0.5 + 0.5 * (v / absMax);
        const c = AION.cmap(t);
        const bg = AION.rgbStr(c);
        const fg = AION.rgbLum(c) < 0.45 ? '#ffffff' : '#000000';
        const cellH = strikes.length <= 40 ? 26 : strikes.length <= 80 ? 22 : 18;
        const cellW = Math.max(64, 4);
        html += `<td style="background:${bg};color:${fg};border:1px solid rgba(0,0,0,0.35);${spotOutline}height:${cellH}px;min-width:${cellW}px;text-align:center;padding:2px 4px;font-size:8px;font-weight:700;font-family:var(--font-mono)">${AION.fmtDollar(v)}</td>`;
      });
      html += '</tr>';
    });

    html += '</tbody></table>';
    html += `<div style="margin-top:8px">
      <div style="height:10px;border-radius:3px;width:180px;background:linear-gradient(90deg,#ff69b4,#7b2fff)"></div>
      <div style="display:flex;justify-content:space-between;width:180px;font-size:9px;color:var(--text-dim);margin-top:2px;font-family:var(--font-mono)">
        <span>− Negative GEX</span><span>+ Positive GEX</span>
      </div>
    </div>`;

    container.innerHTML = html;
  }

  function renderVexTable(strikes, expiries, vexGrid, spot) {
    const strikesDesc = [...strikes].sort((a, b) => b - a);
    let absMax = 0;
    vexGrid.forEach(row => row.forEach(v => { if (Math.abs(v) > absMax) absMax = Math.abs(v); }));
    if (absMax === 0) absMax = 1;

    const container = document.getElementById('vex-grid-container');
    if (!container) return;

    let html = '<table style="border-collapse:collapse;width:100%;font-size:9px;font-family:var(--font-mono)">';
    html += '<thead><tr>';
    html += '<th style="text-align:right;padding:3px 6px 3px 0;color:var(--text-dim);font-weight:400;font-size:9px">Strike</th>';
    expiries.forEach(exp => {
      const mmdd = String(exp).slice(5);
      html += `<th style="text-align:center;padding:3px 2px;color:var(--text-dim);font-weight:400;font-size:9px">${mmdd}</th>`;
    });
    html += '</tr></thead><tbody>';

    strikesDesc.forEach(strike => {
      const origIdx = strikes.indexOf(strike);
      const isSpot = Math.abs(strike - spot) <= Math.min(1, (strikes[1] - strikes[0]) / 2);
      const spotOutline = isSpot ? 'outline:1px solid rgba(0,200,212,0.5);outline-offset:-1px;' : '';
      const strikeColor = isSpot ? 'color:#00c8d4;font-weight:700;' : 'color:var(--text-dim);';
      const strikeLabel = (isSpot ? '→ ' : '') + '$' + (strike >= 100 ? strike.toFixed(0) : strike.toFixed(2));

      html += '<tr>';
      html += `<td style="text-align:right;padding:2px 6px 2px 0;white-space:nowrap;${strikeColor}font-size:9px">${strikeLabel}</td>`;

      expiries.forEach((_, expIdx) => {
        const v = vexGrid[origIdx] ? vexGrid[origIdx][expIdx] : 0;
        const t = 0.5 + 0.5 * (v / absMax);
        const c = AION.cmap(t);
        const bg = AION.rgbStr(c);
        const fg = AION.rgbLum(c) < 0.45 ? '#ffffff' : '#000000';
        const cellH = strikes.length <= 40 ? 26 : strikes.length <= 80 ? 22 : 18;
        const cellW = Math.max(64, 4);
        html += `<td style="background:${bg};color:${fg};border:1px solid rgba(0,0,0,0.35);${spotOutline}height:${cellH}px;min-width:${cellW}px;text-align:center;padding:2px 4px;font-size:8px;font-weight:700;font-family:var(--font-mono)">${AION.fmtDollar(v)}</td>`;
      });
      html += '</tr>';
    });

    html += '</tbody></table>';
    html += `<div style="margin-top:8px">
      <div style="height:10px;border-radius:3px;width:180px;background:linear-gradient(90deg,#ff69b4,#7b2fff)"></div>
      <div style="display:flex;justify-content:space-between;width:180px;font-size:9px;color:var(--text-dim);margin-top:2px;font-family:var(--font-mono)">
        <span>− Negative VEX</span><span>+ Positive VEX</span>
      </div>
    </div>`;

    container.innerHTML = html;
  }

  async function renderHeatmap() {
    const card = document.querySelector('#heatmap-card');
    try {
      const data = await buildGexGrid();
      renderGexTable(data.strikes, data.expiries, data.gex, data.spot);
      const hasVex = data.vex && data.vex.some(row => row.some(v => v !== 0));
      if (hasVex) {
        renderVexTable(data.strikes, data.expiries, data.vex, data.spot);
      } else {
        const vexContainer = document.getElementById('vex-grid-container');
        if (vexContainer) {
          vexContainer.innerHTML = `<div class="muted" style="font-size:11px;padding:18px 0;text-align:center">VEX data not yet available from backend.</div>`;
        }
      }
    } catch (err) {
      card.querySelector('h3').insertAdjacentHTML('afterend', errorPane(err));
    }
  }

  // ---------- RS card ----------
  async function renderRSCard() {
    const card = document.querySelector('#rs-card .content');
    card.innerHTML = skeleton(2);
    try {
      const r = await api(`/rs/candidates/${TICKER}`).catch(() => null);
      if (!r) { card.innerHTML = `<div class="muted">No RS data for ${TICKER}.</div>`; return; }
      const score = Number(r.rs_score || 0);
      const conds = [
        { label: 'RS pct ≥ 75', on: Number(r.rs_percentile || 0) >= 75 },
        { label: 'RS new high (63d)', on: !!r.rs_new_high_63d },
        { label: 'RS-before-price', on: !!r.rs_new_high_before_price },
        { label: 'Px > 200d', on: !!r.price_above_200d_ma },
        { label: 'Px > 50w', on: !!r.price_above_50w_ma },
      ];
      const dotsHtml = conds.map(c => `<span class="dot ${c.on ? 'on' : ''}" title="${c.label}"></span>`).join('');
      const percentile = Number(r.rs_percentile || 0);
      card.innerHTML = `
        <div class="row-line"><span class="muted">RS Score</span><span class="mono">${score.toFixed(0)}</span></div>
        <div class="gauge" style="margin:6px 0 12px;height:8px" title="Percentile: ${percentile.toFixed(0)}th">
          <div class="gauge-fill" style="width:${AION.clamp(percentile,0,100)}%;background:var(--rs-blue)"></div>
        </div>
        <div style="font-size:9px;color:var(--text-dim);margin-top:-8px;margin-bottom:8px">${percentile.toFixed(0)}th percentile</div>
        <div class="row-line"><span class="muted">RS new high</span><span class="mono">${r.rs_new_high_63d ? '✓' : '—'}</span></div>
        <div class="row-line"><span class="muted">RS-before-price</span><span class="mono">${r.rs_new_high_before_price ? '✓' : '—'}</span></div>
        <div class="row-line"><span class="muted">Conditions</span><span class="dots">${dotsHtml}</span></div>
      `;
    } catch (err) { card.innerHTML = errorPane(err); }
  }

  // ---------- Macro mini ----------
  async function renderMacroMini() {
    const el = document.querySelector('#macro-mini .content');
    el.innerHTML = skeleton(3);
    try {
      const b = await api('/agents/brief/latest');
      if (!b || b.error) { el.innerHTML = `<div class="muted">No brief.</div>`; return; }
      const briefText = b.brief || b.exec_summary || b.narrative || '';
      const tags = (b.narrative_tags || []).slice(0, 8);
      const tagFilter = tags.filter(t => String(t).toUpperCase().includes(TICKER));
      const showTags = tagFilter.length ? tagFilter : tags;
      el.innerHTML = `
        <div class="flex gap-8" style="margin-bottom:8px;flex-wrap:wrap">
          <span class="badge ${regimeClass(b.regime || b.dominant_regime)}">${b.regime || b.dominant_regime || '—'}</span>
          <span class="badge ${regimeClass(b.risk_level)}">RISK: ${b.risk_level || '—'}</span>
        </div>
        <div class="muted" style="font-size:11.5px;line-height:1.6">${(b.dominant_signal || '').slice(0, 200)}</div>
        <details style="margin-top:8px">
          <summary class="muted uppercase" style="font-size:10px;cursor:pointer">Full brief</summary>
          <div style="margin-top:8px;font-size:11.5px;white-space:pre-wrap">${String(briefText).slice(0, 2000)}</div>
        </details>
        <div class="flex gap-8" style="margin-top:10px;flex-wrap:wrap">${showTags.map(t => `<span class="pill">${t}</span>`).join('')}</div>
        <div class="muted" style="font-size:10px;margin-top:8px">${b.generated_at || ''}</div>
      `;
    } catch (err) { el.innerHTML = errorPane(err); }
  }

  // ---------- Trade Plan chat ----------
  function renderChatHistory() {
    const wrap = document.getElementById('tp-history');
    wrap.innerHTML = chatMessages.map(m => `
      <div class="chat-msg ${m.role}">${m.role === 'system' ? '⚙ ' : ''}${escapeHtml(m.content)}</div>
    `).join('');
    wrap.scrollTop = wrap.scrollHeight;
  }
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
  }

  function dealerContext() {
    if (!dealerCache) return null;
    const r = dealerCache;
    const spot = Number(r.spot || 0);
    const cwPct = spot && r.call_wall ? ((Number(r.call_wall) - spot) / spot * 100) : 0;
    const pwPct = spot && r.put_wall ? ((Number(r.put_wall) - spot) / spot * 100) : 0;
    return {
      ticker: TICKER, spot,
      king_node: r.king_node, call_wall: r.call_wall, put_wall: r.put_wall,
      regime: r.regime,
      call_wall_pct: cwPct, put_wall_pct: pwPct,
    };
  }

  async function sendChat() {
    const inp = document.getElementById('tp-input');
    const btn = document.getElementById('tp-send');
    const text = inp.value.trim();
    if (!text) return;
    chatMessages.push({ role: 'user', content: text });
    inp.value = '';
    renderChatHistory();
    btn.disabled = true;
    try {
      const result = await apiPost('/agents/chat', {
        messages: chatMessages.filter(m => m.role !== 'system').map(m => ({ role: m.role, content: m.content })),
        context: dealerContext(),
      });
      const reply = result.reply || result.error || '(no reply)';
      chatMessages.push({ role: 'assistant', content: reply });
      renderChatHistory();
    } catch (err) {
      chatMessages.push({ role: 'assistant', content: 'Error: ' + (err.message || err) });
      renderChatHistory();
    } finally {
      btn.disabled = false;
    }
  }

  // ---------- Init ----------
  async function refresh() {
    await renderDealer();
    renderHeatmap();
    renderRSCard();
    renderMacroMini();
    renderContracts('bullish');
  }

  let tvLive = true;

  function toggleTVFeed() {
    tvLive = !tvLive;
    document.getElementById('tv-live-wrap').style.display = tvLive ? 'block' : 'none';
    document.getElementById('tv-static-wrap').style.display = tvLive ? 'none' : 'block';
    const btn = document.getElementById('tv-toggle-btn');
    btn.textContent = tvLive ? 'ON' : 'OFF';
    btn.style.borderColor = tvLive ? 'var(--orange)' : 'var(--border)';
    btn.style.color = tvLive ? 'var(--orange)' : 'var(--text-dim)';
    if (!tvLive) {
      setTimeout(drawStaticPriceChart, 50);
    }
  }

  function drawStaticPriceChart() {
    const canvas = document.getElementById('tv-static-canvas');
    if (!canvas) return;
    const dpr = window.devicePixelRatio || 1;
    const W = canvas.parentElement.clientWidth || 600;
    const H = 460;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    const ctx = canvas.getContext('2d');
    ctx.scale(dpr, dpr);
    ctx.fillStyle = '#0d0d0d';
    ctx.fillRect(0, 0, W, H);

    const pad = { l: 48, r: 20, t: 20, b: 30 };

    const spot = dealerCache ? Number(dealerCache.spot || 0) : 0;

    ctx.fillStyle = 'rgba(100,116,139,0.5)';
    ctx.font = '11px JetBrains Mono';
    ctx.textAlign = 'left';
    ctx.fillText(`${TICKER} · 15m  [live feed paused]`, pad.l + 4, pad.t + 14);

    if (spot > 0) {
      const midY = H / 2;
      ctx.strokeStyle = 'rgba(160,160,160,0.2)';
      ctx.lineWidth = 1;
      ctx.setLineDash([4, 4]);
      ctx.beginPath();
      ctx.moveTo(pad.l, midY);
      ctx.lineTo(W - pad.r, midY);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = '#a0a0a0';
      ctx.textAlign = 'left';
      ctx.font = '10px JetBrains Mono';
      ctx.fillText(`$${spot.toFixed(2)}`, pad.l + 4, midY - 4);
    }
  }

  ready(() => {
    renderNav('symbol');
    document.title = `ETRNL · ${TICKER}`;
    loadTradingView();

    document.querySelectorAll('#contracts-card button[data-bias]').forEach(b => {
      b.addEventListener('click', () => renderContracts(b.dataset.bias));
    });

    document.querySelectorAll('#strike-group button').forEach(b => {
      b.addEventListener('click', () => {
        document.querySelectorAll('#strike-group button').forEach(x => x.classList.remove('active'));
        b.classList.add('active');
        strikeRange = Number(b.dataset.v);
        renderHeatmap();
      });
    });
    document.querySelectorAll('#expiry-group button').forEach(b => {
      b.addEventListener('click', () => {
        document.querySelectorAll('#expiry-group button').forEach(x => x.classList.remove('active'));
        b.classList.add('active');
        expiryCount = Number(b.dataset.v);
        renderHeatmap();
      });
    });

    document.getElementById('tp-send').addEventListener('click', sendChat);
    document.getElementById('tp-input').addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); sendChat(); }
    });

    chatMessages.push({ role: 'system', content: `Trade Plan agent loaded for ${TICKER}. Ask about levels, sizing, stops.` });
    renderChatHistory();

    document.getElementById('tv-toggle-btn').addEventListener('click', toggleTVFeed);

    refresh();
    setInterval(() => { renderDealer(); renderHeatmap(); }, 30000);
  });
  </script>
</body>
</html>
